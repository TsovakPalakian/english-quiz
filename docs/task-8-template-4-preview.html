<!DOCTYPE html>
<html lang="en" data-theme="sky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Sentence Analysis in Progress</title>
  <link rel="stylesheet" href="/site/preview.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
    }
    .preview-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }
    .mock-side {
      width: 220px;
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .mock-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 16px;
    }
    .mock-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--mute);
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
      text-align: left;
    }
    .mock-nav-item.active {
      background: var(--acc-s);
      color: var(--acc);
    }
    .mock-main {
      flex: 1;
      padding: 32px 40px;
      max-width: 900px;
    }
    .meta-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .meta-bar h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .add-sentence-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }
    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gemini-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--acc-s);
      color: var(--acc);
      border: 1px solid var(--acc);
    }
    .sentence-textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 80px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
    }
    .analyzing-box {
      margin-top: 20px;
      padding: 24px;
      background: var(--acc-s);
      border: 1px solid var(--acc);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--line);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .analyzing-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .analyzing-sub {
      font-size: 12px;
      color: var(--mute);
    }
  </style>
</head>
<body>
  <div class="preview-layout">
    <aside class="mock-side">
      <div class="mock-brand">
        <span style="color:var(--acc); font-size:20px;">✦</span>
        <span>Lumiscia</span>
      </div>
      <button class="mock-nav-item">Home</button>
      <button class="mock-nav-item">Lessons</button>
      <button class="mock-nav-item active">Words</button>
      <button class="mock-nav-item">Grammar</button>
      <button class="mock-nav-item">Entertainment</button>
      <button class="mock-nav-item">Speakout</button>
    </aside>

    <main class="mock-main">
      <div class="meta-bar">
        <span class="crumb"><button class="btn ghost icon" type="button" data-jump="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"></path><path d="M7 10.5V20h10v-9.5"></path><path d="M10 20v-5h4v5"></path></svg></button><button class="btn ghost icon" type="button" data-nav-back="" data-fallback="wordcollections" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 6 6 12l6 6"></path></svg></button></span>
        <h1>My sentences</h1>
      </div>

      <div class="add-sentence-card">
        <div class="card-heading">
          <div class="card-title">
            <span>Add a new sentence</span>
            <span class="gemini-badge">✦ Gemini AI</span>
          </div>
          <span style="font-size:12px; color:var(--mute);">Bidirectional · Auto-detect</span>
        </div>

        <textarea class="sentence-textarea" readonly>The true mastery comes when students actively construct sentences.</textarea>

        <div class="analyzing-box">
          <div class="spinner"></div>
          <div class="analyzing-text">Analyzing sentence with Gemini AI…</div>
          <div class="analyzing-sub">Synthesizing natural, conversational, and contextual translation choices (600–1200 ms)</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
