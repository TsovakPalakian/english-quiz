<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumiscia · Local quiz review pilot</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/review-local.css"><script type="module" src="/review-local.js"></script></head>
<body>
<aside><div class="brand"><img src="/favicon.svg" alt="" width="44" height="44"><div><strong>Lumiscia</strong><span>Learning studio</span></div></div><nav aria-label="Quiz review"><button data-view="word">Words</button><button data-view="queue">Review queue</button><button data-view="mine">My proposals</button><button data-view="quota" hidden>Generation quota</button><button data-view="providers" hidden>Language providers</button></nav><div class="aside-bottom"><label>Test account<select id="account" disabled></select></label><label>Theme<select id="theme"><option value="light">Light</option><option value="ocean">Ocean</option></select></label><p>Local test accounts only</p></div></aside>
<main><p class="preview-note">Local backend pilot · SQLite in memory · Saved until server restart · No production connection</p><header><h1 id="title">Quiz review</h1></header><div id="content" aria-busy="true">Loading test data…</div></main><p id="notice" role="status" aria-live="polite"></p>
<dialog id="editor" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title">Quiz draft</h2><p id="edit-context" class="muted"></p><label>Type<select id="edit-type"></select></label><div id="edit-items"></div><button type="button" id="add-quiz-item" title="Add item" aria-label="Add item">+ Add item</button><label>Explanation<textarea id="edit-explanation" required maxlength="4000"></textarea></label><p id="edit-error" class="local-error" role="alert" hidden></p><div class="actions"><button type="button" data-close="editor">Cancel</button><button class="primary" type="submit">Save draft</button></div></form></dialog>
<dialog id="decision" aria-labelledby="decision-title"><form id="decision-form"><h2 id="decision-title"></h2><div id="decision-content"></div><div class="actions"><button type="button" data-close="decision">Cancel</button><button class="primary" id="decision-confirm" type="submit">Confirm</button></div></form></dialog>
<dialog id="history" aria-labelledby="history-title"><h2 id="history-title">Version history</h2><div id="history-content"></div><button data-close="history" type="button">Close</button></dialog>
<dialog id="kit-session" aria-labelledby="kit-session-title"><h2 id="kit-session-title">Quiz version</h2><div data-kit-session-body></div><div class="actions"><button type="button" data-kit-action="close-session">Close</button></div></dialog>
</body></html>
