# Authorized TEST activation with shared real D1/R2 accounts; production unchanged.
name = "learn-english-turso-integrated-test"
account_id = "22f73bd94b002b9aee8eed13d261cf13"
main = "../src/turso-integrated-worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false
[assets]
directory = "../rollback/turso-worker-assets"
binding = "ASSETS"
run_worker_first = true
[[d1_databases]]
binding = "DB"
database_name = "learn-english"
database_id = "00083392-f0d6-4c56-a0a3-cd1a6a16bd67"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "learn-english-media"
[[r2_buckets]]
binding = "STAGE_MEDIA"
bucket_name = "learn-english-turso-test-media"
[[durable_objects.bindings]]
name = "AUTH_BUDGET"
class_name = "StageAuthBudget"
[[migrations]]
tag = "integrated-account-budget-v1"
new_sqlite_classes = ["StageAuthBudget"]
[vars]
STAGE_ENABLED = "true"
STAGE_WRITES = "true"
ACCOUNT_MUTATIONS_ENABLED = "true"
ACCOUNT_QUERY_LIMIT_ENABLED = "false"
STAGE_ALLOWED_HOST = "learn-english-turso-integrated-test.east-tarsal.workers.dev"
STAGE_MEDIA_BUCKET = "learn-english-turso-test-media"
# Separate SESSION_SECRET and retained-test TURSO secrets installed privately.
# Never run live account mutation checks against production D1/R2.
