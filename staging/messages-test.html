<section id="messages">
  <div class="meta"><button class="btn ghost" type="button" data-nav-back data-fallback="account">Back</button><h1>Messages</h1></div>
  <div class="msg-toolbar">
    <div class="msg-tabs" role="tablist" aria-label="Message categories">
      <button class="btn on" type="button" role="tab" aria-selected="true" data-msg-category="personal">Personal</button>
      <button class="btn" type="button" role="tab" aria-selected="false" data-msg-category="learning">Learning</button>
    </div>
    <button class="btn" id="msgNew" type="button">New chat</button>
    <button class="btn" id="msgAssign" type="button" hidden>Assign exam</button>
  </div>
  <p id="msgStatus" class="hint" role="status" hidden></p>
  <div class="msg-workspace">
    <aside class="msg-sidebar">
      <input id="msgRoomSearch" type="search" placeholder="Search conversations" aria-label="Search conversations">
      <label class="msg-unread"><input id="msgUnreadOnly" type="checkbox"> Unread only</label>
      <div id="msgRooms"></div>
    </aside>
    <div class="msg-conversation">
      <header class="msg-room-head"><button class="btn icon msg-list-back" id="msgListBack" type="button" aria-label="Back to conversations" title="Back to conversations">&#8592;</button><h2 id="msgRoomTitle">Choose a conversation</h2><button class="btn icon" id="msgMute" type="button" aria-label="Mute conversation" title="Mute conversation" hidden>&#9834;</button></header>
      <input id="msgTextSearch" type="search" placeholder="Search messages" aria-label="Search messages" disabled>
      <button class="btn ghost" id="msgOlder" type="button" hidden>Earlier messages</button>
      <div id="msgTimeline" class="msg-timeline" aria-label="Conversation" tabindex="0"></div>
      <button class="btn" id="msgLatest" type="button" hidden>New messages</button>
      <div id="msgReply" class="msg-reply" hidden></div>
      <form id="msgCompose" hidden>
        <label id="msgAnnouncementLabel" class="msg-unread" hidden><input id="msgAnnouncement" type="checkbox"> Learning announcement</label>
        <textarea id="msgText" rows="3" maxlength="4000" aria-label="Message" placeholder="Write a message"></textarea>
        <div class="msg-compose-actions"><button class="btn icon" id="msgEmoji" type="button" aria-label="Emoji" title="Emoji" aria-expanded="false" aria-controls="msgEmojiPicker"><svg class="lucide lucide-smile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button><span id="msgSendState" class="hint" role="status"></span><button class="btn primary" id="msgSend" type="submit">Send</button></div>
        <div id="msgEmojiPicker" class="msg-emoji-picker" aria-label="Choose emoji" hidden></div>
      </form>
    </div>
  </div>
</section>
