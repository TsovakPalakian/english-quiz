<section id="messages" aria-label="Messages">
  <div class="chat-shell saas-card">
    <nav class="chat-rail" aria-label="Chat navigation">
      <div class="chat-window-controls" aria-label="Window controls">
        <button type="button" id="msgWinClose" class="chat-win-subtle close" title="Close window" aria-label="Close window">
          <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
        <button type="button" id="msgWinMin" class="chat-win-subtle minimize" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8"/></svg>
        </button>
        <button type="button" id="msgWinExpand" class="chat-win-subtle expand" title="Compact window" aria-label="Compact window">
          <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5H11.5V7M7 11.5H4.5V9M11.5 4.5L8 8M4.5 11.5L8 8"/></svg>
        </button>
      </div>
      <button type="button" id="msgProfile" class="chat-avatar saas-btn" title="Settings" aria-label="Settings">Me</button>
      <button type="button" id="msgChats" class="chat-rail-item selected saas-btn" title="Chats"><i data-lucide="message-circle"></i><span>Chats</span></button>
      <button type="button" id="msgContacts" class="chat-rail-item saas-btn" title="Contacts"><i data-lucide="users-round"></i><span>Contacts</span></button>
      <div class="chat-rail-bottom">
        <button type="button" id="msgSettings" class="chat-icon saas-btn" title="Settings" aria-label="Settings"><i data-lucide="settings"></i></button>
        <button type="button" id="msgExit" class="chat-icon saas-btn" title="Back to site" aria-label="Back to site"><i data-lucide="panel-left-close"></i></button>
      </div>
    </nav>
    <aside class="chat-list saas-card" aria-label="Conversations">
      <header class="chat-panel-head"><h2 id="msgListTitle">Chats</h2><button type="button" id="msgUnread" class="chat-icon saas-btn" title="Unread conversations" aria-label="Unread conversations" aria-pressed="false"><i data-lucide="list-filter"></i></button><button type="button" id="msgNew" class="chat-icon primary saas-btn" title="New chat" aria-label="New chat"><i data-lucide="plus"></i></button><button type="button" id="msgHideList" class="chat-icon saas-btn" title="Hide conversations" aria-label="Hide conversations"><i data-lucide="panel-left-close"></i></button></header>
      <label class="chat-search"><i data-lucide="search"></i><input id="msgRoomSearch" class="saas-input" type="search" placeholder="Chats, contacts" aria-label="Search chats"></label>
      <div class="chat-categories saas-segmented" role="tablist"><button type="button" role="tab" class="saas-btn" data-msg-category="personal">Personal</button><button type="button" role="tab" class="saas-btn" data-msg-category="learning">Study alerts</button><button type="button" role="tab" class="saas-btn" id="msgContactsTab" aria-selected="false">Contacts</button></div>
      <div id="msgRooms" class="chat-room-list"></div>
    </aside>
    <div id="msgResizeLeft" class="chat-resizer" role="separator" aria-label="Conversation panel width" aria-orientation="vertical" tabindex="0"></div>
    <main class="chat-center">
      <header class="chat-panel-head chat-room-head">
        <button type="button" id="msgListBack" class="chat-icon" title="Show conversations" aria-label="Show conversations"><i data-lucide="panel-left"></i></button>
        <button type="button" id="msgRoomInfo" class="chat-room-heading" title="Info"><span id="msgRoomAvatar" class="chat-avatar"><i data-lucide="users-round"></i></span><span><strong id="msgRoomTitle">Messages</strong><small id="msgRoomSubtitle">Choose a conversation</small></span></button>
        <button type="button" id="msgSearch" class="chat-icon chat-search-toggle" title="Search messages" aria-label="Search messages"><i data-lucide="search"></i></button>
        <button type="button" id="msgInfo" class="chat-icon" title="Info" aria-label="Info"><i data-lucide="panel-right"></i></button>
      </header>
      <div id="msgStatus" class="chat-status" role="status" hidden></div>
      <div id="msgAccess" class="chat-access" hidden></div>
      <button id="msgPinned" class="chat-pinned" type="button" hidden></button>
      <div id="msgSelection" class="chat-selection" hidden></div>
      <div id="msgTimeline" class="chat-timeline" role="log" aria-label="Conversation" aria-live="polite"></div>
      <button type="button" id="msgLatest" class="chat-latest" title="Latest messages" aria-label="Latest messages" hidden><i data-lucide="arrow-down"></i></button>
      <form id="msgCompose" class="chat-composer saas-card" hidden>
        <div id="msgReply" class="chat-reply" hidden></div>
        <div id="msgAttachments" class="chat-attachments"></div>
        <textarea id="msgText" maxlength="4000" rows="2" placeholder="Enter message" aria-label="Message" enterkeyhint="send"></textarea>
        <div id="msgEmojiPicker" class="chat-emoji-picker" hidden></div>
        <div class="chat-compose-tools">
          <button type="button" id="msgAttach" class="chat-icon saas-btn saas-btn-icon" title="Attach file" aria-label="Attach file"><i data-lucide="paperclip"></i></button>
          <input id="msgFile" type="file" multiple hidden>
          <button type="button" id="msgEmoji" class="chat-icon saas-btn saas-btn-icon" title="Smileys" aria-label="Smileys" aria-expanded="false"><i data-lucide="smile"></i></button>
          <button type="button" id="msgStickers" class="chat-icon saas-btn saas-btn-icon" title="Emoji" aria-label="Emoji" aria-expanded="false"><i data-lucide="grid-2x2"></i></button>
          <span id="msgSendState" role="status"></span>
          <button type="button" id="msgMic" class="chat-icon saas-btn saas-btn-icon" title="Record voice message" aria-label="Record voice message"><i data-lucide="mic"></i></button>
          <button type="button" id="msgVideo" class="chat-icon saas-btn saas-btn-icon" title="Record video message" aria-label="Record video message" hidden><i data-lucide="video"></i></button>
          <button type="button" id="msgCancelRecording" class="chat-icon danger saas-btn saas-btn-icon" title="Cancel recording" aria-label="Cancel recording" hidden><i data-lucide="x"></i></button>
          <button type="submit" id="msgSend" class="chat-icon chat-send saas-btn saas-btn-icon" title="Send" aria-label="Send"><i data-lucide="send-horizontal"></i></button>
        </div>
      </form>
    </main>
    <div id="msgResizeRight" class="chat-resizer" role="separator" aria-label="Information panel width" aria-orientation="vertical" tabindex="0" hidden></div>
    <aside id="msgRight" class="chat-info" aria-label="Info" hidden>
      <header class="chat-panel-head chat-info-head"><h2 id="msgRightTitle">Info</h2><button type="button" id="msgHideInfo" class="chat-icon" title="Close panel" aria-label="Close panel"><i data-lucide="x"></i></button></header>
      <div id="msgInfoContent" class="chat-info-content"></div>
      <div id="msgSearchContent" class="chat-info-content" hidden>
        <label class="chat-search"><i data-lucide="search"></i><input id="msgTextSearch" type="search" placeholder="Search messages" aria-label="Search messages"></label>
        <div id="msgSearchResults"></div><button id="msgSearchMore" class="chat-link" type="button" hidden>More results</button>
      </div>
    </aside>
  </div>
  <div id="msgContext" class="chat-context" role="menu" aria-label="Message actions" hidden></div>
</section>

<div id="chatMiniWindow" class="chat-mini-window" role="dialog" aria-label="Compact conversation" hidden>
  <header class="chat-mini-head">
    <div class="chat-mini-controls" aria-label="Window controls">
      <button type="button" id="miniWinClose" class="chat-win-subtle close" title="Close window" aria-label="Close window">
        <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
      <button type="button" id="miniWinMin" class="chat-win-subtle minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8"/></svg>
      </button>
      <button type="button" id="miniWinMax" class="chat-win-subtle expand" title="Expand to full window" aria-label="Expand to full window">
        <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5H11.5V7M7 11.5H4.5V9M11.5 4.5L8 8M4.5 11.5L8 8"/></svg>
      </button>
    </div>
    <button type="button" id="miniPeerSelector" class="chat-mini-peer-select-btn" title="Switch conversation" aria-label="Switch conversation" aria-expanded="false">
      <div class="chat-mini-avatar-wrap">
        <span id="miniRoomAvatar" class="chat-mini-avatar">TP</span>
        <span class="chat-mini-presence"></span>
      </div>
      <div class="chat-mini-peer-info">
        <div class="chat-mini-peer-title-row">
          <strong id="miniRoomTitle">Teacher</strong>
          <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor" class="chat-mini-chevron"><path d="M4 6l4 4 4-4H4z"/></svg>
        </div>
        <small id="miniRoomSubtitle">Online</small>
      </div>
    </button>
    <div id="miniPeerDropdown" class="chat-mini-peer-dropdown" hidden>
      <div class="chat-mini-dropdown-head">Switch conversation</div>
      <div id="miniPeerList" class="chat-mini-peer-list"></div>
    </div>
  </header>
  <div id="miniTimeline" class="chat-mini-timeline" role="log" aria-label="Conversation" aria-live="polite"></div>
  <form id="miniComposer" class="chat-mini-composer">
    <div id="miniEmojiPicker" class="chat-mini-emoji-picker" hidden>
      <div class="chat-mini-emoji-picker-head" id="miniEmojiHead">Smileys & Emoji</div>
      <div class="chat-mini-emoji-grid" id="miniEmojiGrid"></div>
    </div>
    <div id="miniAttachments" class="chat-mini-attachments" hidden></div>
    <textarea id="miniInput" class="chat-mini-textarea" placeholder="Enter message" rows="2" maxlength="4000" aria-label="Message text"></textarea>
    <div class="chat-mini-tools-row">
      <div class="chat-mini-tools-left">
        <button type="button" id="miniAttach" class="chat-mini-tool-btn" title="Attach file" aria-label="Attach file">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button type="button" id="miniEmoji" class="chat-mini-tool-btn" title="Smileys" aria-label="Smileys">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <button type="button" id="miniStickers" class="chat-mini-tool-btn" title="Emoji" aria-label="Emoji">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <div id="miniColorIndicator" class="chat-mini-color-indicator" title="Text color">
          <input type="color" id="miniColorInput" style="opacity:0;width:0;height:0;position:absolute;pointer-events:none;" aria-label="Text color">
        </div>
      </div>
      <div class="chat-mini-tools-right">
        <button type="button" id="miniMic" class="chat-mini-tool-btn" title="Hold to record voice; click to switch to video" aria-label="Record voice message">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <div class="chat-mini-tool-sep"></div>
        <button type="submit" id="miniSend" class="chat-mini-send-action-btn" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </form>
  <div class="chat-resize-corner" aria-hidden="true">
    <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L2 8M9 5L5 9M9 8L8 9"/></svg>
  </div>
</div>

<div id="chatDockWidget" class="chat-dock-bar" role="region" aria-label="Chat widget" title="Drag to move" hidden>
  <div class="chat-dock-avatar-wrap" id="chatDockAvatarWrap">
    <span class="chat-dock-avatar" id="chatDockAvatar">TP</span>
    <span class="chat-dock-presence is-online"></span>
  </div>
  <div class="chat-dock-info" id="chatDockInfo">
    <strong id="chatDockTitle">Teacher</strong>
    <small id="chatDockSubtitle">Active conversation</small>
  </div>
  <div class="chat-dock-actions" id="chatDockActions">
    <button type="button" id="chatDockExpand" class="chat-dock-btn expand" title="Expand to window" aria-label="Expand to window">
      <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5H11.5V7M7 11.5H4.5V9M11.5 4.5L8 8M4.5 11.5L8 8"/></svg>
    </button>
    <button type="button" id="chatDockClose" class="chat-dock-btn close" title="Close chat" aria-label="Close chat">
      <svg viewBox="0 0 16 16" width="8" height="8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
</div>
