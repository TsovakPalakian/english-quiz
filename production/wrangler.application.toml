# Production preflight endpoint: authenticated educational reads only.
name = "learn-english-turso-production"
account_id = "22f73bd94b002b9aee8eed13d261cf13"
main = "../src/turso-production-worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../rollback/turso-production-assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "learn-english"
database_id = "00083392-f0d6-4c56-a0a3-cd1a6a16bd67"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "learn-english-media"

[[r2_buckets]]
binding = "CONTENT_MEDIA"
bucket_name = "learn-english-production-media"

[[durable_objects.bindings]]
name = "AUTH_BUDGET"
class_name = "StageAuthBudget"

[[migrations]]
tag = "production-account-budget-v1"
new_sqlite_classes = ["StageAuthBudget"]

[vars]
CONTENT_ENABLED = "true"
CONTENT_WRITES = "false"
CONTENT_ALLOWED_HOST = "learn-english-turso-production.east-tarsal.workers.dev"
CONTENT_MEDIA_BUCKET = "learn-english-production-media"
ACCOUNT_MUTATIONS_ENABLED = "true"
ACCOUNT_QUERY_LIMIT_ENABLED = "false"
EXPRESSION_ANALYZER_URL = "https://92-5-115-171.sslip.io"
EXPRESSION_ANALYZER_TIMEOUT = "60000"
# TURSO_URL/TURSO_AUTH_TOKEN installed; SESSION_SECRET must be installed before
# activation. Never copy an old SESSION_SECRET into this file.
