name: Restore private CI inputs
description: Download the pinned archive from private R2 with a fresh per-job signature
inputs:
  r2-access-key-id:
    description: Read-only R2 access key for the CI inputs bucket
    required: true
  r2-secret-access-key:
    description: Corresponding read-only R2 secret access key
    required: true
  sha256:
    description: SHA256 of the approved build inputs archive
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install pinned R2 signing dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check --requirement ops/ci-requirements.txt
    - name: Download and restore verified inputs
      shell: bash
      run: python ops/ci-build-inputs.py restore
      env:
        CI_R2_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        CI_R2_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        CI_BUILD_INPUTS_SHA256: ${{ inputs.sha256 }}
